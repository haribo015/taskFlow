name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

defaults:
  run:
    working-directory: frontend

jobs:
  tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Unit tests (Vitest)
        run: >-
          npx ng test --watch=false
          --reporters=default --reporters=junit --output-file=reports/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-frontend
          path: frontend/reports/
          retention-days: 7
          if-no-files-found: warn

  quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: ESLint (angular-eslint)
        run: npx ng lint

      - name: Prettier
        run: npm run format:check

      - name: Production build (type check + budgets)
        run: npx ng build --configuration production

  image:
    name: Frontend Docker image
    needs: [tests, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: frontend
          tags: taskflow/frontend:${{ github.sha }}
          push: false
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke test the container
        run: |
          docker run -d --name web -p 8080:8080 taskflow/frontend:${{ github.sha }}
          sleep 2
          curl -fsS http://localhost:8080/workspaces | grep -q "<app-root"
