name: Supply chain

# Runs on main only (after the PR checks went green): publish the six images to
# GHCR, then produce and verify the evidence for each digest:
#   publish -> SBOM (SPDX JSON) -> keyless Cosign signature -> provenance and SBOM
#   attestations -> remote verification -> Trivy scan of the verified digest.
# Every step after the build uses image@digest, never a tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a half-finished publication: queue the next run instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy:
    name: Supply chain policy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Pinned actions and image digests
        run: python scripts/taskflow.py supply-chain-policy

  publish:
    name: Publish (${{ matrix.image }})
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GHCR
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: user-service, context: services/user-service }
          - { image: workspace-service, context: services/workspace-service }
          - { image: task-service, context: services/task-service }
          - { image: analytics-service, context: services/analytics-service }
          - { image: frontend, context: frontend }
          - { image: gateway, context: gateway }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name (GHCR needs lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Record the digest produced by Buildx
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p evidence
          echo "$DIGEST" > "evidence/${{ matrix.image }}.digest"
          echo "### ${{ matrix.image }}: \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      - name: SBOM (Syft, SPDX JSON) of image@digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: evidence/${{ matrix.image }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload digest and SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.image }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error

  sign:
    name: Sign and attest (${{ matrix.image }})
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # push signature and attestations next to the image
      id-token: write # OIDC identity for keyless signing (no stored key)
      attestations: write # store the attestations on GitHub
    strategy:
      fail-fast: false
      matrix:
        image: [user-service, workspace-service, task-service, analytics-service, frontend, gateway]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence-${{ matrix.image }}
          path: evidence

      - name: Image reference
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "DIGEST=$(cat evidence/${{ matrix.image }}.digest)" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Keyless Cosign signature
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Provenance attestation (SLSA)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
          create-storage-record: false # only available to organization repositories

      - name: SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: evidence/${{ matrix.image }}.spdx.json
          push-to-registry: true
          create-storage-record: false

  verify:
    name: Verify and scan (${{ matrix.image }})
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # pull the image, its signature and attestations
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        image: [user-service, workspace-service, task-service, analytics-service, frontend, gateway]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence-${{ matrix.image }}
          path: evidence

      - name: Image reference
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "DIGEST=$(cat evidence/${{ matrix.image }}.digest)" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the signature (identity of this workflow on main)
        run: |
          cosign verify \
            --certificate-identity "${{ github.server_url }}/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$DIGEST" | tee "evidence/${{ matrix.image }}.cosign.json"

      - name: Verify the provenance and SBOM attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --format json > "evidence/${{ matrix.image }}.provenance.json"
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://spdx.dev/Document/v2.3 > /dev/null
          echo "provenance and SBOM attestations verified for $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy scan of the verified digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ env.DIGEST }}
          format: table
          output: evidence/${{ matrix.image }}.trivy.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.image }}
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
