name: Microservices CI

# One pipeline per microservice (matrix): tests + quality gate -> Docker image.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only need to read the repository.
permissions:
  contents: read

# A new push on the same branch/PR cancels the obsolete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  tests:
    name: Python tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, workspace-service, task-service, analytics-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: >-
          pytest
          --junitxml=reports/junit.xml
          --cov=app --cov-report=term --cov-report=xml:reports/coverage.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/reports/
          retention-days: 7
          if-no-files-found: warn

  quality:
    name: Python quality (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, workspace-service, task-service, analytics-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Install Ruff
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: Ruff lint (annotations on the PR)
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check --diff .

      - name: Ruff report
        if: always()
        run: |
          mkdir -p reports
          ruff check --output-format=junit --output-file=reports/ruff-junit.xml . || true

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-report-${{ matrix.service }}
          path: services/${{ matrix.service }}/reports/
          retention-days: 7
          if-no-files-found: warn

  image:
    name: Docker image (${{ matrix.service }})
    # The image is only built when both tests and quality are green.
    needs: [tests, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, workspace-service, task-service, analytics-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ matrix.service }}
          tags: taskflow/${{ matrix.service }}:${{ github.sha }}
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Smoke test the container
        run: |
          docker run -d --name svc -e DATABASE_URL=sqlite://:memory: taskflow/${{ matrix.service }}:${{ github.sha }}
          for _ in $(seq 1 20); do
            if docker exec svc python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"; then
              echo "healthy"; exit 0
            fi
            sleep 1
          done
          docker logs svc; exit 1

      - name: Vulnerability scan (Trivy, report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: taskflow/${{ matrix.service }}:${{ github.sha }}
          format: table
          output: trivy-${{ matrix.service }}.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload image scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scan-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.txt
          retention-days: 7
          if-no-files-found: warn
