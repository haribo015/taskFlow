name: Integration

# Builds every image with Docker Compose (including the gateway), starts the
# whole stack and runs the end-to-end smoke scenario through the gateway.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 180

      - name: End-to-end smoke test
        run: python scripts/taskflow.py smoke

      - name: Collect logs
        if: always()
        run: |
          mkdir -p reports
          docker compose ps > reports/compose-ps.txt
          docker compose logs --no-color > reports/compose-logs.txt
          docker image ls "taskflow/*" > reports/images.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs
          path: reports/
          retention-days: 7

      - name: Stop stack
        if: always()
        run: docker compose down -v
