name: Integration

# Builds every image with Docker Compose (including the gateway), starts the
# whole stack and runs the end-to-end smoke scenario through the gateway.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Supply chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Pinned actions and image digests
        run: python scripts/taskflow.py supply-chain-policy

  compose:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 180

      - name: End-to-end smoke test
        run: python scripts/taskflow.py smoke

      - name: Collect logs
        if: always()
        run: |
          mkdir -p reports
          docker compose ps > reports/compose-ps.txt
          docker compose logs --no-color > reports/compose-logs.txt
          docker image ls "taskflow/*" > reports/images.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs
          path: reports/
          retention-days: 7

      - name: Stop stack
        if: always()
        run: docker compose down -v
