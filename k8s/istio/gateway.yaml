apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: taskflow
  namespace: taskflow
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: taskflow
  namespace: taskflow
spec:
  hosts:
    - "*"
  gateways:
    - taskflow
  http:
    - route:
        - destination:
            host: gateway.taskflow.svc.cluster.local
            port:
              number: 8080
