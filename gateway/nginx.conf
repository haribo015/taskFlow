# TaskFlow API gateway: single entry point routing to each microservice.
upstream user_service      { server user-service:8000; }
upstream workspace_service { server workspace-service:8000; }
upstream task_service      { server task-service:8000; }
upstream analytics_service { server analytics-service:8000; }
upstream frontend          { server frontend:8080; }

server {
    listen 8080;
    server_name _;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;
    add_header X-Request-ID $request_id always;

    location = /gateway/health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    # Prefix matches without trailing slash so that e.g. POST /api/workspaces is routed too.
    location /api/auth       { proxy_pass http://user_service; }
    location /api/users      { proxy_pass http://user_service; }
    location /api/workspaces { proxy_pass http://workspace_service; }
    location /api/tasks      { proxy_pass http://task_service; }
    location /api/analytics  { proxy_pass http://analytics_service; }

    location /api/ {
        default_type application/json;
        return 404 '{"detail":"Unknown API route"}';
    }

    # Everything else: Angular single-page application
    location / { proxy_pass http://frontend; }
}
